name: Blue-Green Deploy Docker Image

on:
  workflow_run:
    workflows:
      - Build and Push Docker Image
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, windows, x64]

    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/spam-detection-web-app:latest
      PROXY_NAME: spam-detection-proxy
      BLUE_NAME: spam-detection-web-app-blue
      GREEN_NAME: spam-detection-web-app-green
      BLUE_PORT: '5001'
      GREEN_PORT: '5002'
      STABLE_PORT: '5000'

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Monitor and deploy Blue-Green in one PowerShell step
        shell: powershell
        run: |
          $stateDir = $null
          $phasePath = $null
          $stopPath = $null
          $logPath = $null
          $stdoutPath = $null
          $stderrPath = $null
          $monitor = $null
          $deploymentError = $null
          $verificationError = $null
          $mode = 'unknown'

          function Set-Phase([string]$phase) {
            Set-Content -LiteralPath $phasePath -Value $phase -Encoding utf8
            Write-Host "Availability phase changed to '$phase'."
          }

          function Assert-Monitor([string]$expectedPhase) {
            if (-not $monitor) { throw "Availability monitor was not started for phase '$expectedPhase'." }
            $monitorProcess = Get-Process -Id $monitor.Id -ErrorAction SilentlyContinue
            if (-not $monitorProcess) {
              if ($stdoutPath -and (Test-Path -LiteralPath $stdoutPath)) { Get-Content -LiteralPath $stdoutPath }
              if ($stderrPath -and (Test-Path -LiteralPath $stderrPath)) { Get-Content -LiteralPath $stderrPath }
              throw "Availability monitor PID $($monitor.Id) is not running at phase '$expectedPhase'."
            }
            $actualPhase = (Get-Content -LiteralPath $phasePath -Raw).Trim()
            Write-Host "Availability monitor PID $($monitor.Id) is alive; phase='$actualPhase'."
            if ($actualPhase -ne $expectedPhase) {
              throw "Availability monitor phase mismatch: expected '$expectedPhase', actual '$actualPhase'."
            }
          }

          function Wait-ForPhaseRequest([string]$phase, [int]$timeoutSeconds = 30) {
            $deadline = (Get-Date).AddSeconds($timeoutSeconds)
            while ((Get-Date) -lt $deadline) {
              if (Test-Path -LiteralPath $logPath) {
                $rows = @(Get-Content -LiteralPath $logPath | Select-Object -Skip 1 | Where-Object { $_ -match "^[^,]+,$phase," })
                if ($rows.Count -ge 1) {
                  Write-Host "Availability monitor recorded a '$phase' request."
                  return
                }
              }
              Assert-Monitor $phase
              Start-Sleep -Seconds 1
            }
            throw "Availability monitor did not record a '$phase' request within $timeoutSeconds seconds."
          }

          function Test-Http([string]$url, [int]$attempts = 60) {
            Add-Type -AssemblyName System.Net.Http
            $lastError = 'No HTTP 200 response received.'
            for ($i = 0; $i -lt $attempts; $i++) {
              $handler = $null
              $client = $null
              try {
                $handler = New-Object System.Net.Http.HttpClientHandler
                $handler.UseProxy = $false
                $client = New-Object -TypeName System.Net.Http.HttpClient -ArgumentList $handler
                $client.Timeout = [TimeSpan]::FromSeconds(5)
                $response = $client.GetAsync($url).GetAwaiter().GetResult()
                $statusCode = [int]$response.StatusCode
                if ($statusCode -eq 200) { return $true }
                $lastError = "HTTP status $statusCode"
              } catch {
                $lastError = $_.Exception.ToString().Replace([Environment]::NewLine, ' | ')
              } finally {
                if ($client) { $client.Dispose() }
                if ($handler) { $handler.Dispose() }
              }
              Start-Sleep -Seconds 1
            }
            Write-Warning "HTTP health check failed for $url after $attempts attempts. Last error: $lastError"
            return $false
          }

          function Test-InternalHttp([string]$containerName, [int]$attempts = 60) {
            $lastError = 'No internal HTTP 200 response received.'
            $pythonCheck = "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:5000/', timeout=5).status)"
            for ($i = 0; $i -lt $attempts; $i++) {
              $output = ''
              $exitCode = 1
              try {
                $output = (& docker exec $containerName python -c $pythonCheck 2>&1 | Out-String).Trim()
                $exitCode = $LASTEXITCODE
              } catch {
                $output = $_.Exception.ToString().Replace([Environment]::NewLine, ' | ')
                $exitCode = 1
              }
              if ($exitCode -eq 0 -and $output -match '(?m)^\s*200\s*$') {
                Write-Host "Candidate internal HTTP check succeeded on attempt $($i + 1): $output"
                return $true
              }
              if ($exitCode -ne 0) { $lastError = "docker exec exit code ${exitCode}: $output" }
              else { $lastError = "Unexpected internal HTTP output: $output" }
              Start-Sleep -Seconds 1
            }
            Write-Warning "Candidate internal HTTP check failed after $attempts attempts. Last error: $lastError"
            return $false
          }

          function Test-StableHttp([string]$url, [int]$requiredSuccesses = 10, [int]$attempts = 60) {
            Add-Type -AssemblyName System.Net.Http
            $consecutive = 0
            $lastError = 'No consecutive HTTP 200 responses received.'
            for ($i = 0; $i -lt $attempts; $i++) {
              $handler = New-Object System.Net.Http.HttpClientHandler
              $handler.UseProxy = $false
              $client = New-Object -TypeName System.Net.Http.HttpClient -ArgumentList $handler
              $client.Timeout = [TimeSpan]::FromSeconds(5)
              try {
                $response = $client.GetAsync($url).GetAwaiter().GetResult()
                $statusCode = [int]$response.StatusCode
                if ($statusCode -eq 200) {
                  $consecutive++
                  if ($consecutive -ge $requiredSuccesses) { return $true }
                } else {
                  $lastError = "HTTP status $statusCode"
                  $consecutive = 0
                }
              } catch {
                $lastError = $_.Exception.ToString().Replace([Environment]::NewLine, ' | ')
                $consecutive = 0
              } finally {
                $client.Dispose()
                $handler.Dispose()
              }
              Start-Sleep -Seconds 1
            }
            Write-Warning "Stable HTTP check failed for $url after $attempts attempts. Last error: $lastError"
            return $false
          }

          function Get-NginxConfigDump {
            $output = (& docker exec $proxyName sh -c 'nginx -T 2>&1' 2>&1 | Out-String).Trim()
            $exitCode = $LASTEXITCODE
            [pscustomobject]@{ Output = $output; ExitCode = $exitCode }
          }

          function Normalize-PathForComparison([string]$path) {
            if ([string]::IsNullOrWhiteSpace($path)) { return '' }
            return (($path -replace '/', '\').TrimEnd('\')).ToLowerInvariant()
          }

          function Write-ProxyConfig([string]$backendPort) {
            $content = @"
          events {}
          http {
              server {
                  listen 5000;
                  location / {
                      proxy_pass http://host.docker.internal:$backendPort;
                      proxy_set_header Host `$host;
                      proxy_set_header X-Real-IP `$remote_addr;
                      proxy_set_header X-Forwarded-For `$proxy_add_x_forwarded_for;
                  }
              }
          }
          "@
            $utf8NoBom = New-Object System.Text.UTF8Encoding -ArgumentList $false
            [System.IO.File]::WriteAllText($configPath, $content, $utf8NoBom)
          }

          try {
            if ([string]::IsNullOrWhiteSpace($env:TEMP)) { throw 'Windows TEMP environment variable is not available.' }
            $stateDir = Join-Path $env:TEMP "spam-cd-$env:GITHUB_RUN_ID"
            New-Item -ItemType Directory -Force -Path $stateDir | Out-Null
            if (-not (Test-Path -LiteralPath $stateDir -PathType Container)) { throw "Could not create state directory: $stateDir" }
            $phasePath = Join-Path $stateDir 'phase.txt'
            $stopPath = Join-Path $stateDir 'stop'
            $logPath = Join-Path $stateDir 'availability.csv'
            $scriptPath = Join-Path $stateDir 'monitor.ps1'
            $stdoutPath = Join-Path $stateDir 'monitor.stdout.log'
            $stderrPath = Join-Path $stateDir 'monitor.stderr.log'

            Set-Content -LiteralPath $phasePath -Value 'before' -Encoding utf8
            Set-Content -LiteralPath $logPath -Value 'timestamp,phase,status_code,success,response_ms,error' -Encoding utf8
            Remove-Item -LiteralPath $stopPath -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $stdoutPath,$stderrPath -Force -ErrorAction SilentlyContinue

            $monitorScript = @'
          param([string]$PhasePath, [string]$StopPath, [string]$LogPath, [string]$Url)
          Add-Type -AssemblyName System.Net.Http
          while (-not (Test-Path -LiteralPath $StopPath)) {
            $phase = (Get-Content -LiteralPath $PhasePath -Raw).Trim()
            $timestamp = (Get-Date).ToUniversalTime().ToString('o')
            $watch = [System.Diagnostics.Stopwatch]::StartNew()
            $statusCode = ''
            $success = $false
            $errorText = ''
            $handler = New-Object System.Net.Http.HttpClientHandler
            $handler.UseProxy = $false
            $client = New-Object -TypeName System.Net.Http.HttpClient -ArgumentList $handler
            $client.Timeout = [TimeSpan]::FromSeconds(5)
            try {
              $response = $client.GetAsync($Url).GetAwaiter().GetResult()
              $statusCode = [int]$response.StatusCode
              $success = ($statusCode -eq 200)
            } catch {
              $errorText = $_.Exception.ToString().Replace(',', ';').Replace([Environment]::NewLine, ' | ')
              Write-Warning "Availability check failed for ${Url}: $errorText"
            } finally {
              $watch.Stop()
              $client.Dispose()
              $handler.Dispose()
            }
            $line = '{0},{1},{2},{3},{4},{5}' -f $timestamp, $phase, $statusCode, $success, $watch.ElapsedMilliseconds, $errorText
            Add-Content -LiteralPath $LogPath -Value $line -Encoding utf8
            Start-Sleep -Seconds 1
          }
          '@
            Set-Content -LiteralPath $scriptPath -Value $monitorScript -Encoding utf8

            $originalTrackingId = $env:RUNNER_TRACKING_ID
            try {
              $env:RUNNER_TRACKING_ID = ''
              $monitor = Start-Process -FilePath powershell.exe -WindowStyle Hidden -PassThru -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File',$scriptPath,'-PhasePath',$phasePath,'-StopPath',$stopPath,'-LogPath',$logPath,'-Url',"http://127.0.0.1:$env:STABLE_PORT/")
            } finally {
              $env:RUNNER_TRACKING_ID = $originalTrackingId
            }
            Write-Host "Availability monitor started with PID $($monitor.Id)."
            Assert-Monitor 'before'
            Wait-ForPhaseRequest 'before'
            Set-Phase 'during'
            Assert-Monitor 'during'
            Wait-ForPhaseRequest 'during'

            if ([string]::IsNullOrWhiteSpace($env:LOCALAPPDATA)) { throw 'LOCALAPPDATA environment variable is not available.' }
            $proxyConfigDir = Join-Path $env:LOCALAPPDATA 'spam-cd-proxy'
            New-Item -ItemType Directory -Force -Path $proxyConfigDir | Out-Null
            if (-not (Test-Path -LiteralPath $proxyConfigDir -PathType Container)) { throw "Could not create proxy config directory: $proxyConfigDir" }
            $configPath = Join-Path $proxyConfigDir 'nginx.conf'
            $proxyName = $env:PROXY_NAME
            $blueName = $env:BLUE_NAME
            $greenName = $env:GREEN_NAME

            docker pull $env:IMAGE_NAME
            $proxyRunning = docker ps --filter "name=^$proxyName$" --format '{{.Names}}'
            $legacyRunning = docker ps --filter 'name=^spam-detection-web-app$' --format '{{.Names}}'

            if (-not $proxyRunning) {
              if ($legacyRunning) { throw "Legacy container '$legacyRunning' owns port 5000. It was left running; perform the one-time proxy migration." }
              $mode = 'initial-setup'
              Set-Phase 'during'
              Assert-Monitor 'during'
              Wait-ForPhaseRequest 'during'
              docker rm -f $blueName $greenName 2>$null
              docker run -d --name $blueName --restart unless-stopped -p "127.0.0.1:$env:BLUE_PORT`:5000" $env:IMAGE_NAME | Out-Null
              if (-not (Test-InternalHttp $blueName 60) -and -not (Test-Http "http://127.0.0.1:$env:BLUE_PORT/" 60)) { docker logs $blueName; throw 'Blue candidate failed health checks.' }
              Write-ProxyConfig $env:BLUE_PORT
              docker run -d --name $proxyName --restart unless-stopped -p "127.0.0.1:$env:STABLE_PORT`:5000" --mount "type=bind,source=$configPath,target=/etc/nginx/nginx.conf,readonly" nginx:alpine | Out-Null
              if (-not (Test-StableHttp "http://127.0.0.1:$env:STABLE_PORT/" 10 60)) { docker logs $proxyName; throw 'Initial proxy health check failed.' }
              Set-Phase 'after'
              Assert-Monitor 'after'
              Wait-ForPhaseRequest 'after'
              Start-Sleep -Seconds 10
            } else {
              $proxyConfig = Get-NginxConfigDump
              if ($proxyConfig.ExitCode -ne 0) { throw "Could not read current Nginx config: $($proxyConfig.Output)" }
              $currentConfig = $proxyConfig.Output
              if ($currentConfig -match 'host\.docker\.internal:5001') { $activeName=$blueName; $activePort=$env:BLUE_PORT; $candidateName=$greenName; $candidatePort=$env:GREEN_PORT }
              elseif ($currentConfig -match 'host\.docker\.internal:5002') { $activeName=$greenName; $activePort=$env:GREEN_PORT; $candidateName=$blueName; $candidatePort=$env:BLUE_PORT }
              else { throw 'Current Nginx upstream is not Blue or Green.' }
              $activeState = docker inspect --format '{{.State.Status}}' $activeName 2>&1 | Out-String
              if ($activeState.Trim() -ne 'running') { throw "Active container '$activeName' is not running." }

              $proxyInspect = docker inspect $proxyName | ConvertFrom-Json
              $fixedConfigNormalized = Normalize-PathForComparison $configPath
              $fixedMount = @($proxyInspect.Mounts | Where-Object { $_.Destination -eq '/etc/nginx/nginx.conf' -and (Normalize-PathForComparison $_.Source) -eq $fixedConfigNormalized })
              if ($fixedMount.Count -eq 0) {
                $mode = 'proxy-migration'
                Set-Phase 'during'
                Assert-Monitor 'during'
                Wait-ForPhaseRequest 'during'
                Write-ProxyConfig $activePort
                docker rm -f $proxyName | Out-Null
                docker run -d --name $proxyName --restart unless-stopped -p "127.0.0.1:$env:STABLE_PORT`:5000" --mount "type=bind,source=$configPath,target=/etc/nginx/nginx.conf,readonly" nginx:alpine | Out-Null
                if (-not (Test-StableHttp "http://127.0.0.1:$env:STABLE_PORT/" 5 30)) { docker logs $proxyName; throw 'Proxy migration health check failed.' }
              } else { $mode = 'subsequent-redeploy' }

              Set-Phase 'during'
              Assert-Monitor 'during'
              Wait-ForPhaseRequest 'during'
              docker rm -f $candidateName 2>$null
              docker run -d --name $candidateName --restart unless-stopped -p "127.0.0.1:$candidatePort`:5000" $env:IMAGE_NAME | Out-Null
              $candidateState = docker inspect --format '{{.State.Status}}' $candidateName 2>&1 | Out-String
              docker ps --filter "name=^$candidateName$"
              $portOutput = docker port $candidateName 5000/tcp 2>&1 | Out-String
              Write-Host "Candidate docker state: $candidateState"
              Write-Host "Candidate docker port mapping:`n$portOutput"
              if ($candidateState.Trim() -ne 'running' -or $portOutput -notmatch "127\.0\.0\.1:$candidatePort") { docker logs $candidateName; throw 'Candidate container state or port mapping is invalid.' }
              $internalReady = Test-InternalHttp $candidateName 60
              if (-not $internalReady) { Write-Warning 'Internal check did not become ready; host-port check remains authoritative.' }
              if (-not (Test-Http "http://127.0.0.1:$candidatePort/" 60)) { docker logs $candidateName; throw "Candidate '$candidateName' failed host HTTP health check." }

              Write-ProxyConfig $candidatePort
              docker exec $proxyName nginx -t
              docker exec $proxyName nginx -s reload
              $loadedConfigResult = Get-NginxConfigDump
              if ($loadedConfigResult.ExitCode -ne 0 -or $loadedConfigResult.Output -notmatch "host\.docker\.internal:$candidatePort") {
                Write-Host "Post-reload nginx -T output: $($loadedConfigResult.Output)"
                Write-ProxyConfig $activePort
                docker exec $proxyName nginx -t
                docker exec $proxyName nginx -s reload
                docker rm -f $candidateName | Out-Null
                throw 'Nginx reload verification failed; traffic was not switched.'
              }
              if (-not (Test-StableHttp "http://127.0.0.1:$env:STABLE_PORT/" 10 60)) {
                Write-ProxyConfig $activePort
                docker exec $proxyName nginx -t
                docker exec $proxyName nginx -s reload
                if (-not (Test-StableHttp "http://127.0.0.1:$env:STABLE_PORT/" 5 30)) { throw 'Proxy rollback health check failed; both containers were left for investigation.' }
                docker rm -f $candidateName | Out-Null
                throw 'Stable proxy health check failed; traffic was rolled back.'
              }
              Write-Host "Traffic switch is stable; keeping active container '$activeName' alive for a 15-second grace period."
              Start-Sleep -Seconds 15
              if (-not (Test-StableHttp "http://127.0.0.1:$env:STABLE_PORT/" 10 60)) { throw 'Pre-removal grace-period stability check failed; active container was not removed.' }
              if (-not (Test-Http "http://127.0.0.1:$env:STABLE_PORT/" 10)) { throw 'Final pre-removal HTTP check failed; active container was not removed.' }
              docker rm -f $activeName | Out-Null
              if (-not (Test-StableHttp "http://127.0.0.1:$env:STABLE_PORT/" 10 60)) { throw 'Post-removal stability check failed after active container removal.' }
              Set-Phase 'after'
              Assert-Monitor 'after'
              Wait-ForPhaseRequest 'after'
              Start-Sleep -Seconds 10
            }
          } catch {
            $deploymentError = $_
            Write-Error $_
          } finally {
            if ($monitor -and (Get-Process -Id $monitor.Id -ErrorAction SilentlyContinue)) {
              New-Item -ItemType File -Force -Path $stopPath | Out-Null
              Wait-Process -Id $monitor.Id -Timeout 15 -ErrorAction SilentlyContinue
            }
            if ($stdoutPath -and (Test-Path -LiteralPath $stdoutPath)) { Write-Host '--- monitor stdout ---'; Get-Content -LiteralPath $stdoutPath }
            if ($stderrPath -and (Test-Path -LiteralPath $stderrPath)) { Write-Warning '--- monitor stderr ---'; Get-Content -LiteralPath $stderrPath }
            if ($logPath -and (Test-Path -LiteralPath $logPath)) {
              Add-Content -LiteralPath $env:GITHUB_ENV -Value "SPAM_CD_LOG=$logPath"
              $rows = @(Import-Csv -LiteralPath $logPath)
              $total = $rows.Count
              $success = @($rows | Where-Object { $_.success -eq 'True' }).Count
              $failed = $total - $success
              $before = @($rows | Where-Object { $_.phase -eq 'before' }).Count
              $during = @($rows | Where-Object { $_.phase -eq 'during' }).Count
              $after = @($rows | Where-Object { $_.phase -eq 'after' }).Count
              $beforeSuccess = @($rows | Where-Object { $_.phase -eq 'before' -and $_.success -eq 'True' }).Count
              $duringSuccess = @($rows | Where-Object { $_.phase -eq 'during' -and $_.success -eq 'True' }).Count
              $afterSuccess = @($rows | Where-Object { $_.phase -eq 'after' -and $_.success -eq 'True' }).Count
              $beforeFailed = $before - $beforeSuccess
              $duringFailed = $during - $duringSuccess
              $afterFailed = $after - $afterSuccess
              $failedRows = @($rows | Where-Object { $_.success -ne 'True' })
              $times = @($rows | ForEach-Object { [DateTime]::Parse($_.timestamp) } | Sort-Object)
              $maxGap = 0
              for ($i=1; $i -lt $times.Count; $i++) { $gap=($times[$i]-$times[$i-1]).TotalSeconds; if($gap -gt $maxGap){$maxGap=$gap} }
              $outage = if ($total -eq 0) { 'UNKNOWN — no HTTP requests were recorded; verification failed' } elseif ($failed -gt 0) { 'YES — one or more HTTP requests failed' } else { 'NO — all recorded HTTP requests succeeded' }
              $summary = @('## Blue-Green deployment availability summary','',"- Deployment mode: **$mode**","- Total requests: **$total**","- Successful requests: **$success**","- Failed requests: **$failed**","- Before successful/failed: **$beforeSuccess / $beforeFailed**","- During successful/failed: **$duringSuccess / $duringFailed**","- After successful/failed: **$afterSuccess / $afterFailed**","- Maximum request interval: **$([Math]::Round($maxGap,2)) seconds**","- Service interruption detected: **$outage**",'',"| Phase | Requests |","|---|---:|","| Before deployment | $before |","| During deployment | $during |","| After deployment | $after |",'', '### Failed request details')
              if ($failedRows.Count -eq 0) {
                $summary += '- None'
              } else {
                foreach ($failedRow in ($failedRows | Select-Object -First 20)) {
                  $summary += "- $($failedRow.timestamp) | phase=$($failedRow.phase) | status=$($failedRow.status_code) | response_ms=$($failedRow.response_ms) | error=$($failedRow.error)"
                }
              }
              $summary += ""
              $summary += "Availability log: ``$logPath``"
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ($summary -join [Environment]::NewLine)
              if ($total -eq 0 -or $before -lt 1 -or $during -lt 1 -or $after -lt 1) { $verificationError = "Availability verification incomplete: total=$total, before=$before, during=$during, after=$after" }
            } else { $verificationError = 'Availability CSV was not created.' }
          }
          if ($deploymentError) { throw $deploymentError }
          if ($verificationError) { throw $verificationError }

      - name: Upload availability log
        if: always() && env.SPAM_CD_LOG != ''
        uses: actions/upload-artifact@v4
        with:
          name: spam-cd-availability-${{ github.run_id }}
          path: ${{ env.SPAM_CD_LOG }}
