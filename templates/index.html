<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spam Message Detection</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <div class="eyebrow">MACHINE LEARNING DEMO</div>
    <h1>Spam Message Detection</h1>
    <p class="subtitle">영어 SMS 메시지를 입력하면 Spam 또는 Ham인지 판별합니다.</p>
    <form id="predict-form">
      <label for="message">SMS 메시지</label>
      <textarea id="message" name="message" rows="6" placeholder="예: Congratulations! You have won a free prize..."></textarea>
      <button type="submit">판별하기</button>
    </form>
    <div id="result" class="result hidden" aria-live="polite"></div>
    <p id="error" class="error hidden"></p>
    <p class="notice">안내: 이 결과는 머신러닝 모델의 예측이며 100% 정확하지 않을 수 있습니다.</p>
  </main>
  <script>
    const form = document.getElementById('predict-form');
    const message = document.getElementById('message');
    const result = document.getElementById('result');
    const error = document.getElementById('error');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      result.className = 'result hidden'; error.className = 'error hidden';
      try {
        const response = await fetch('/predict', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({message: message.value})});
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '예측 중 문제가 발생했습니다.');
        result.className = `result ${data.label.toLowerCase()}`;
        result.innerHTML = `<span class="badge">${data.label}</span><strong>스팸일 확률 ${data.spam_probability.toFixed(2)}%</strong>`;
      } catch (e) { error.textContent = e.message; error.className = 'error'; }
    });
  </script>
</body>
</html>
